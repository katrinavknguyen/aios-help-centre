\"#\">Seeing what a worker actually did</a><a href=\"#\">My worker gave a confidently wrong answer</a></div><div class=\"artfoot\"><p>Did this answer your question?<span>If not, the Assistant can look at your account directly.</span></p><div class=\"actions\"><button class=\"btn btn-secondary btn-sm\">No</button><button class=\"btn btn-primary btn-sm\">Ask the Assistant</button></div></div></div>", "costs": "<a class=\"crumb\" href=\"#\" data-go=\"doc\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m15 18-6-6 6-6\"/></svg>All help articles</a><div class=\"article\"><h1>What things cost, in bands</h1><div class=\"lede\">Not everything costs the same, and the gap between the cheapest and most expensive action is large. Think in bands rather than exact figures.</div><p>Every action a worker takes consumes credits. A call, a message, an analysis, a task run, a browser session, a document produced. Knowing which band a kind of work sits in is enough to make good decisions.</p>\n<h2>The bands</h2>\n<p><strong>A background task run. Small.</strong> A record updated, a notification sent, a field written back. Around two to five credits for a routine run, rising where a job has many steps and touches several systems.</p>\n<p><strong>An SMS. Small.</strong> Around six credits a message, so a three-message exchange is three times one.</p>\n<p><strong>A chat answer from your knowledge. Small.</strong> Usually five to eight. A longer exchange involving an image and a handover can reach the low twenties.</p>\n<p><strong>Analysing a call. Small.</strong> Roughly five to twenty, depending on the length of the call and how deep the analysis goes. The material already exists, which is why analysis is usually the cheapest way to get value early.</p>\n<p><strong>A voice call. Scales with time.</strong> Use around thirty credits a minute as a planning figure. The actual cost moves with what happens on the call, so treat a long conversation as materially more than a short one.</p>\n<p><strong>A Command run. Small to medium.</strong> Depends on what you asked it to do. A quick lookup or a short draft sits with the small actions. A run that researches, works through a dataset and produces a report scales with the work involved.</p>\n<div class=\"callout\"><b>These are indicative bands drawn from live accounts, not a rate card,</b> and they move as the work changes. Billing and Usage shows every action that has actually used credits in your own account, which is the figure to work from.</div>\n<h2>The comparison that matters</h2>\n<p>Judge a credit figure against what the same work costs when a person does it, not against zero. A five-minute call handled at any hour, written up and logged, is worth comparing to the loaded hourly cost of the person who would otherwise have taken it.</p><div class=\"related\"><h3>Related</h3><a href=\"#\">Getting more out of the same spend</a><a href=\"#\">My credit usage is higher than last month</a></div><div class=\"artfoot\"><p>Did this answer your question?<span>If not, the Assistant can look at your account directly.</span></p><div class=\"actions\"><button class=\"btn btn-secondary btn-sm\">No</button><button class=\"btn btn-primary btn-sm\">Ask the Assistant</button></div></div></div>", "optimise": "<a class=\"crumb\" href=\"#\" data-go=\"doc\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m15 18-6-6 6-6\"/></svg>All help articles</a><div class=\"article\"><h1>Getting more out of the same spend</h1><div class=\"lede\">Consumption is not fixed. The same job, configured differently, can cost several times more or less.</div><p>The difference is usually in how the work is put together rather than how much of it there is.</p>\n<p><strong>Put routine work on the right worker.</strong> A Command run scales with the work you give it. Once a job is repetitive and well understood, a Task worker does the same thing at the bottom of the small band.</p>\n<p><strong>Answer from knowledge, not from reasoning.</strong> A question answered straight from a document is cheaper and more accurate than one worked out from scratch every time. Good knowledge lowers cost and raises quality together.</p>\n<p><strong>Keep conversations tight.</strong> Voice scales with time. A script that reaches the point sooner costs less per call and usually converts better, because people do not enjoy long calls either.</p>\n<p><strong>Set limits on the long-running work.</strong> Browser sessions and multi-step tasks should have a step limit and a stopping condition, so a job that goes wrong stops rather than running on.</p>\n<p><strong>Match the volume to the run.</strong> A job running hourly that nobody reads before Friday should run on Friday.</p>\n<div class=\"callout\"><b>We will do this with you.</b> Optimisation is difficult to do blind and straightforward once the use case is known. Tell us the use case and the volume you expect. The aim is the most productive use of what you are already spending, not the smallest number.</div><div class=\"related\"><h3>Related</h3><a href=\"#\">What things cost, in bands</a><a href=\"#\">Why the build runs heavier than the service</a></div><div class=\"artfoot\"><p>Did this answer your question?<span>If not, the Assistant can look at your account directly.</span></p><div class=\"actions\"><button class=\"btn btn-secondary btn-sm\">No</button><button class=\"btn btn-primary btn-sm\">Ask the Assistant</button></div></div></div>", "build-heavier": "<a class=\"crumb\" href=\"#\" data-go=\"doc\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m15 18-6-6 6-6\"/></svg>All help articles</a><div class=\"article\"><h1>Why the build runs heavier than the service</h1><div class=\"lede\">Configuring and testing a worker consumes credits in the same way real work does.</div><p>The weeks you are setting something up will look busier than the steady state that follows. This is normal and it is not a sign that anything is misconfigured.</p>\n<p>It matters because the first month is the one people use to forecast the next twelve, and it is the least representative month you will have.</p>\n<h2>What to do instead</h2>\n<p>Wait until a worker has been live and stable for a few weeks, then read Billing and Usage for that period. That figure is the one worth planning against.</p>\n<div class=\"callout\"><b>Look at Billing and Usage once a month.</b> Ten minutes tells you which of your workers is earning its keep and which is running without anyone reading the output.</div><div class=\"related\"><h3>Related</h3><a href=\"#\">What things cost, in bands</a><a href=\"#\">My credit usage is higher than last month</a></div><div class=\"artfoot\"><p>Did this answer your question?<span>If not, the Assistant can look at your account directly.</span></p><div class=\"actions\"><button class=\"btn btn-secondary btn-sm\">No</button><button class=\"btn btn-primary btn-sm\">Ask the Assistant</button></div></div></div>", "blueprints": "<a class=\"crumb\" href=\"#\" data-go=\"doc\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m15 18-6-6 6-6\"/></svg>All help articles</a><div class=\"article\"><h1>Saving a working worker as a Blueprint</h1><div class=\"lede\">Save a configuration that works and create the next one from it, rather than building from nothing each time.</div><p>Blueprints cover workers, campaigns, support lines, tasks and computer use agents.</p>\n<h2>Where it pays off most</h2>\n<p>For a group of seventeen sites this is the difference between building once and building seventeen times. You build one, get it right, save it, then create the rest from the saved version and change only what is local. Location details, opening times, the transfer number.</p>\n<p>Command can also duplicate a worker directly if you would rather ask than click. Describe what should change on the copy and it will make it.</p>\n<div class=\"callout\"><b>Blueprint the version that works,</b> not the version you have just built. Test it first, then save.</div><div class=\"related\"><h3>Related</h3><a href=\"#\">Rolling one worker out across sites</a><a href=\"#\">Putting a new job live</a></div><div class=\"artfoot\"><p>Did this answer your question?<span>If not, the Assistant can look at your account directly.</span></p><div class=\"actions\"><button class=\"btn btn-secondary btn-sm\">No</button><button class=\"btn btn-primary btn-sm\">Ask the Assistant</button></div></div></div>", "rollout": "<a class=\"crumb\" href=\"#\" data-go=\"doc\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m15 18-6-6 6-6\"/></svg>All help articles</a><div class=\"article\"><h1>Rolling one worker out across sites</h1><div class=\"lede\">Build one, prove it, then create the rest from it.</div><p>The order matters. Building all of them at once means fixing the same mistake in every copy when you find it.</p>\n<h2>The sequence</h2>\n<p>Build and test at one site until it is behaving the way you want.</p>\n<p>Save it as a Blueprint.</p>\n<p>Create each additional site from the Blueprint and change only what is genuinely local. Location details, opening times, the transfer number, the calendar it books into.</p>\n<p>Test each one with your own number before it goes live. It takes a minute per site and it catches the copy that was pointed at the wrong calendar.</p>\n<div class=\"callout\"><b>Keep the knowledge shared where you can.</b> If every site answers the same questions about prices and policies, one knowledge set serving all of them means updating it once rather than seventeen times.</div><div class=\"related\"><h3>Related</h3><a href=\"#\">Saving a working worker as a Blueprint</a><a href=\"#\">Testing with your own number</a></div><div class=\"artfoot\"><p>Did this answer your question?<span>If not, the Assistant can look at your account directly.</span></p><div class=\"actions\"><button class=\"btn btn-secondary btn-sm\">No</button><button class=\"btn btn-primary btn-sm\">Ask the Assistant</button></div></div></div>", "roles": "<a class=\"crumb\" href=\"#\" data-go=\"doc\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m15 18-6-6 6-6\"/></svg>All help articles</a><div class=\"article\"><h1>Adding people and scoping roles</h1><div class=\"lede\">Users lists the people in your account. Roles control what each person can see and do, and can be scoped.</div><p>Someone can be given access to the parts of the account they need and no more.</p>\n<h2>Worth setting up properly early</h2>\n<p>It is easier to add people to a tidy account than to work out afterwards who changed what and whether they should have been able to.</p>\n<p>Activity Logs record who did what, so a tidy user list makes the log readable. A shared login makes it useless.</p>\n<div class=\"callout\"><b>This article is thin on the specifics of each role.</b> If you need to know exactly what a given role can and cannot do in your account, ask the Assistant or your Implement AI contact.</div><div class=\"related\"><h3>Related</h3><a href=\"#\">Activity Logs: what changed and who changed it</a><a href=\"#\">Seeing what a worker actually did</a></div><div class=\"artfoot\"><p>Did this answer your question?<span>If not, the Assistant can look at your account directly.</span></p><div class=\"actions\"><button class=\"btn btn-secondary btn-sm\">No</button><button class=\"btn btn-primary btn-sm\">Ask the Assistant</button></div></div></div>", "cmd-build": "<a class=\"crumb\" href=\"#\" data-go=\"doc\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m15 18-6-6 6-6\"/></svg>All help articles</a><div class=\"article\"><h1>Build and change workers by asking</h1><div class=\"lede\">The fastest route to setting up a worker, and to changing one that is already live.</div><p>You do not have to find the right screen, work out which field controls what, or remember where a setting lives. Describe the change in plain English and Command makes it.</p>\n<p>Command already holds the detail. The workers you are running, the prompts behind them, the documents you have uploaded and the systems you have connected.</p>\n<h2>Things you can say</h2>\n<p><strong>\"Create a support worker for our out-of-hours line. It should answer questions about opening times and take bookings.\"</strong> Builds the worker, drafts its persona, objective and restrictions, and shows you what it has written before anything goes live.</p>\n<p><strong>\"Add the new price list to the knowledge behind our booking worker.\"</strong> Attaches the document so the worker answers from it instead of guessing.</p>\n<p><strong>\"Change the greeting on the inbound line to mention the new opening hours.\"</strong> Updates the greeting on that channel. Live on the next call.</p>\n<p><strong>\"It is being too pushy about booking. Soften it and get it to take no for an answer sooner.\"</strong> Rewrites the objective and tightens the restrictions.</p>\n<p><strong>\"Never let it quote a price. Always pass those to a person.\"</strong> Adds the rule to the restrictions and sets the escalation.</p>\n<p><strong>\"Run the missed-call report every Friday at 10am.\"</strong> Creates the scheduled job and confirms it back to you.</p>\n<p><strong>\"Copy this worker for our second site and change the location details.\"</strong> Duplicates the configuration so you are editing rather than starting again.</p>\n<p><strong>\"That Tuesday job is running twice. Turn one of them off.\"</strong> Finds the duplicate and stops it.</p>\n<div class=\"callout\"><b>Always check the result.</b> Command confirms what it did. Read the confirmation, then test the worker before you rely on it. A prompt change is live immediately, on the very next conversation.</div>\n<h2>The short way and the long way</h2>\n<p>Everything above can also be done by hand in the team screens, and it is worth knowing where those settings live. Use Command for speed, and the screens when you want to see the whole configuration at once.</p>\n<p>Where Command cannot make a change itself, it will say so and tell you where to go. A few things still need us, including phone numbers, new integrations and anything requiring access from your IT.</p><div class=\"related\"><h3>Related</h3><a href=\"#\">How to ask well</a><a href=\"#\">Building your own Command workers</a></div><div class=\"artfoot\"><p>Did this answer your question?<span>If not, the Assistant can look at your account directly.</span></p><div class=\"actions\"><button class=\"btn btn-secondary btn-sm\">No</button><button class=\"btn btn-primary btn-sm\">Ask the Assistant</button></div></div></div>", "cmd-ask": "<a class=\"crumb\" href=\"#\" data-go=\"doc\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m15 18-6-6 6-6\"/></svg>All help articles</a><div class=\"article\"><h1>How to ask well</h1><div class=\"lede\">Five habits that get better results out of Command, and make it easier to check what it did.</div><p><strong>Name the worker you mean.</strong> \"Change the greeting\" is ambiguous once you have several.</p>\n<p><strong>Say what should change and why.</strong> The reason often produces a better edit than the instruction alone.</p>\n<p><strong>One change at a time.</strong> Easier to check, and easier to undo if it is wrong.</p>\n<p><strong>Ask it to show you before it saves,</strong> then read what it wrote.</p>\n<p><strong>Ask it where something is.</strong> It knows its way around better than any document, including this one.</p>\n<h2>Things worth asking it</h2>\n<p>Summarise the enquiries that came in this week. Which site had the most missed calls last month? Draft a reply to this and keep it short. Build me this report and send it every Friday. What changed since last week? Where do I change a worker's settings?</p><div class=\"related\"><h3>Related</h3><a href=\"#\">Build and change workers by asking</a><a href=\"#\">Building your own Command workers</a></div><div class=\"artfoot\"><p>Did this answer your question?<span>If not, the Assistant can look at your account directly.</span></p><div class=\"actions\"><button class=\"btn btn-secondary btn-sm\">No</button><button class=\"btn btn-primary btn-sm\">Ask the Assistant</button></div></div></div>", "cmd-workers": "<a class=\"crumb\" href=\"#\" data-go=\"doc\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m15 18-6-6 6-6\"/></svg>All help articles</a><div class=\"article\"><h1>Building your own Command workers</h1><div class=\"lede\">Create a Command worker for a job you do repeatedly, and the request itself shrinks to a few words.</div><p>Put the detail in its persona. If the persona already defines which report to produce and how, then \"generate report\" is a complete instruction.</p>\n<p>That is the difference between typing a paragraph every time and typing two words.</p>\n<h2>What Command can do on its own</h2>\n<p><strong>Memory.</strong> It keeps your preferences and how you like things done, and applies them in later conversations without being told again.</p>\n<p><strong>Long context.</strong> A one million token context window, so long conversations and large documents stay in view rather than falling out of the back.</p>\n<p><strong>Shared sessions.</strong> Sessions share context. It remembers what happened in earlier conversations, and you can search past sessions by title.</p>\n<p><strong>Web search.</strong> Real-time research on the open internet. Company research, prospect background, checking a fact before it goes in a report.</p>\n<p><strong>Reading a web page.</strong> Point it at a URL and it will visit the page and pull structured information out of it.</p>\n<p><strong>Working with data.</strong> Runs analysis on your data in a sandbox and produces charts and worked calculations, not just a description of them.</p>\n<p><strong>Producing documents.</strong> Branded HTML reports and multi-page PDFs, along with CSV and JSON.</p>\n<p><strong>Scheduled messages.</strong> Send itself an instruction on a recurring or one-off basis, and reply into the same session or a new one.</p>\n<p><strong>Reply length.</strong> Set how long and how detailed you want answers to be by default.</p>\n<h2>Three ways it runs</h2>\n<p><strong>You ask it.</strong> Type the request, or run a preset from the quick command categories above the box.</p>\n<p><strong>On a schedule.</strong> Daily, weekly, monthly, or once at a set time. Say \"run this every Friday at 10am\" and it sets it up.</p>\n<p><strong>Triggered.</strong> An email arriving in a connected inbox, a record created in your CRM, a call finishing, a file landing, or another worker completing its run.</p><div class=\"related\"><h3>Related</h3><a href=\"#\">Visibility: Personal, Team, Private, Public</a><a href=\"#\">How to ask well</a></div><div class=\"artfoot\"><p>Did this answer your question?<span>If not, the Assistant can look at your account directly.</span></p><div class=\"actions\"><button class=\"btn btn-secondary btn-sm\">No</button><button class=\"btn btn-primary btn-sm\">Ask the Assistant</button></div></div></div>", "cmd-visibility": "<a class=\"crumb\" href=\"#\" data-go=\"doc\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m15 18-6-6 6-6\"/></svg>All help articles</a><div class=\"article\"><h1>Visibility: Personal, Team, Private, Public</h1><div class=\"lede\">Each Command worker has a visibility setting. The wording differs depending on where you meet it, but there are only two options.</div><p>The worker's own configuration says <strong>Personal</strong> and <strong>Team</strong>. Elsewhere in the account the same choice appears as <strong>Private</strong> and <strong>Public</strong>. They mean the same thing.</p>\n<p>Personal, or Private, keeps the worker to you. Team, or Public, makes it discoverable and usable by anyone in your organisation.</p>\n<h2>What sharing does and does not share</h2>\n<p>Sharing a worker shares the worker, not the conversations held with it. Colleagues using the same Public worker each see their own chats.</p>\n<p>If two people need to work on the same thing today, the reliable route is for one to run it and share the output.</p><div class=\"related\"><h3>Related</h3><a href=\"#\">Building your own Command workers</a><a href=\"#\">Adding people and scoping roles</a></div><div class=\"artfoot\"><p>Did this answer your question?<span>If not, the Assistant can look at your account directly.</span></p><div class=\"actions\"><button class=\"btn btn-secondary btn-sm\">No</button><button class=\"btn btn-primary btn-sm\">Ask the Assistant</button></div></div></div>", "cmd-model": "<a class=\"crumb\" href=\"#\" data-go=\"doc\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m15 18-6-6 6-6\"/></svg>All help articles</a><div class=\"article\"><h1>Choosing the model behind a worker</h1><div class=\"lede\">Each worker can be pointed at a different underlying model, with Anthropic, OpenAI and Google all available.</div><p>The lists are refreshed as new models are released.</p>\n<p>In practice you rarely need to change this. It matters in two situations: when a job needs more careful reasoning, and when a high-volume job would be better served by something faster.</p>\n<div class=\"callout\"><b>Change one thing at a time.</b> If a worker is underperforming, the cause is far more often thin knowledge or a loose objective than the model behind it. Check those first.</div><div class=\"related\"><h3>Related</h3><a href=\"#\">Building your own Command workers</a><a href=\"#\">Getting more out of the same spend</a></div><div class=\"artfoot\"><p>Did this answer your question?<span>If not, the Assistant can look at your account directly.</span></p><div class=\"actions\"><button class=\"btn btn-secondary btn-sm\">No</button><button class=\"btn btn-primary btn-sm\">Ask the Assistant</button></div></div></div>", "share-outside": "<a class=\"crumb\" href=\"#\" data-go=\"doc\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m15 18-6-6 6-6\"/></svg>All help articles</a><div class=\"article\"><h1>Sharing output with people outside the account</h1><div class=\"lede\">Two routes, and neither requires the recipient to be a user.</div><p><strong>A scheduled job can email its output.</strong> If the same person needs the same thing regularly, put the job on a schedule and have it send directly to them.</p>\n<p><strong>An analyst result can be shared as a link</strong> that opens without a login.</p>\n<p>Table exports work the same way. Any table can be exported and exports arrive by email, and you can export a filtered view rather than everything.</p>\n<div class=\"callout\"><b>Most accounts assume this is not possible</b> and copy results out by hand. Worth checking before you build a manual step around it.</div><div class=\"related\"><h3>Related</h3><a href=\"#\">Can I send a result to someone without a login?</a><a href=\"#\">What comes back out: reports and exports</a></div><div class=\"artfoot\"><p>Did this answer your question?<span>If not, the Assistant can look at your account directly.</span></p><div class=\"actions\"><button class=\"btn btn-secondary btn-sm\">No</button><button class=\"btn btn-primary btn-sm\">Ask the Assistant</button></div></div></div>", "sys-trigger": "<a class=\"crumb\" href=\"#\" data-go=\"doc\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m15 18-6-6 6-6\"/></svg>All help articles</a><div class=\"article\"><h1>Starting a worker from a connected system</h1><div class=\"lede\">An event in something you have already connected can set a worker off. Nothing has to be built for it.</div><p>The connection is already there, so the trigger is a setting rather than a piece of work.</p>\n<h2>Events that can start a worker</h2>\n<p>An email lands in the inbox. A record is created in the CRM. A booking changes. A form is submitted.</p>\n<h2>When you need a webhook instead</h2>\n<p>Use a connected-system trigger where the event you care about is one the connection exposes. Where it is not, or where the system is your own, a webhook covers it. Any system you run can post straight to a worker and start it.</p><div class=\"related\"><h3>Related</h3><a href=\"#\">The five triggers</a><a href=\"#\">Webhooks, in and out</a></div><div class=\"artfoot\"><p>Did this answer your question?<span>If not, the Assistant can look at your account directly.</span></p><div class=\"actions\"><button class=\"btn btn-secondary btn-sm\">No</button><button class=\"btn btn-primary btn-sm\">Ask the Assistant</button></div></div></div>", "add-contacts": "<a class=\"crumb\" href=\"#\" data-go=\"doc\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m15 18-6-6 6-6\"/></svg>All help articles</a><div class=\"article\"><h1>Adding contacts before assigning a worker</h1><div class=\"lede\">Contacts have to be created in CRM before a worker can be assigned to them. They cannot be added from inside a team.</div><p>So the order is always CRM first, then the team.</p>\n<h2>Two ways in</h2>\n<p>Add a contact directly, or import a list.</p>\n<p>Once they exist you can hand a filtered list to whichever worker you want acting on it, rather than assigning them one at a time.</p>\n<div class=\"callout\"><b>Add yourself first.</b> Before pointing a worker at real contacts, add yourself and let it reach you. It costs almost nothing and it is the fastest way to catch a wrong greeting or a broken transfer.</div><div class=\"related\"><h3>Related</h3><a href=\"#\">I cannot add a contact from inside a team</a><a href=\"#\">Testing with your own number</a></div><div class=\"artfoot\"><p>Did this answer your question?<span>If not, the Assistant can look at your account directly.</span></p><div class=\"actions\"><button class=\"btn btn-secondary btn-sm\">No</button><button class=\"btn btn-primary btn-sm\">Ask the Assistant</button></div></div></div>", "test-self": "<a class=\"crumb\" href=\"#\" data-go=\"doc\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m15 18-6-6 6-6\"/></svg>All help articles</a><div class=\"article\"><h1>Testing with your own number</h1><div class=\"lede\">Add yourself as a contact and assign a worker to reach you. The fastest way to experience what your customer experiences.</div><p>Reading a transcript tells you what a worker said. Taking the call tells you what it is like to be on the other end of it, which is a different thing and usually more useful.</p>\n<h2>The full test before going live</h2>\n<p>Use Talk to Agent and Test Messaging for the quick checks.</p>\n<p>Then add yourself as a contact in CRM and let the worker contact you properly, on the channel a customer would use.</p>\n<p>Ask it your most awkward questions before a customer does. The ones your team dreads are the ones worth testing.</p>\n<div class=\"callout\"><b>Test each copy, not just the original.</b> When you roll a worker out across sites, a minute per site catches the copy pointed at the wrong calendar or the wrong transfer number.</div><div class=\"related\"><h3>Related</h3><a href=\"#\">Adding contacts before assigning a worker</a><a href=\"#\">Putting a new job live</a></div><div class=\"artfoot\"><p>Did this answer your question?<span>If not, the Assistant can look at your account directly.</span></p><div class=\"actions\"><button class=\"btn btn-secondary btn-sm\">No</button><button class=\"btn btn-primary btn-sm\">Ask the Assistant</button></div></div></div>", "billing-read": "<a class=\"crumb\" href=\"#\" data-go=\"doc\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m15 18-6-6 6-6\"/></svg>All help articles</a><div class=\"article\"><h1>Reading Billing and Usage</h1><div class=\"lede\">Your credit balance and every action that has actually used credits in your own account. The figure to work from.</div><p>Bands and planning figures are useful for deciding what to build. This screen is what actually happened.</p>\n<h2>Ten minutes a month</h2>\n<p>Sort by the largest consumers and compare the top few against what they produced. If nobody uses the output, turn it off.</p>\n<p>That is usually the whole exercise. It tells you which of your workers is earning its keep and which is running without anyone reading the result.</p>\n<div class=\"callout\"><b>Pair it with Scheduled Jobs.</b> Billing tells you what cost money. Scheduled Jobs tells you what is going to keep costing it.</div><div class=\"related\"><h3>Related</h3><a href=\"#\">What things cost, in bands</a><a href=\"#\">My credit usage is higher than last month</a></div><div class=\"artfoot\"><p>Did this answer your question?<span>If not, the Assistant can look at your account directly.</span></p><div class=\"actions\"><button class=\"btn btn-secondary btn-sm\">No</button><button class=\"btn btn-primary btn-sm\">Ask the Assistant</button></div></div></div>", "duplicating": "<a class=\"crumb\" href=\"#\" data-go=\"doc\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m15 18-6-6 6-6\"/></svg>All help articles</a><div class=\"article\"><h1>Duplicating and editing rather than rebuilding</h1><div class=\"lede\">Editing a working configuration is faster and safer than building a new one from nothing.</div><p>Command can duplicate a worker directly. Describe what should change on the copy and it will make it. \"Copy this worker for our second site and change the location details.\"</p>\n<p>Or save the configuration as a Blueprint and create from that, which is the better route when you will be making many copies rather than one.</p>\n<h2>Which to use</h2>\n<p>Duplicate for a one-off. A second site, a variant campaign, a version you want to experiment with without touching the original.</p>\n<p>Blueprint when the same configuration will be reused repeatedly, or when other people will be creating from it.</p><div class=\"related\"><h3>Related</h3><a href=\"#\">Saving a working worker as a Blueprint</a><a href=\"#\">Rolling one worker out across sites</a></div><div class=\"artfoot\"><p>Did this answer your question?<span>If not, the Assistant can look at your account directly.</span></p><div class=\"actions\"><button class=\"btn btn-secondary btn-sm\">No</button><button class=\"btn btn-primary btn-sm\">Ask the Assistant</button></div></div></div>"};
var el=document.getElementById('view');
function show(k){ el.innerHTML=V[k]||V.doc; window.scrollTo(0,0); }

var MATCH=[
 [['hand','handover','hands over','gives up','escalat'],'handover'],
 [['wrong','incorrect','made up','outdated','old price'],'wrong-answer'],
 [['credit','usage','cost','bill','spend','expensive'],'credits'],
 [['twice','duplicate','double'],'duplicate'],
 [['contact','lead','crm'],'contacts'],
 [['stuck','computer use','browser','frozen','loop'],'stuck'],
 [['english','language','spanish','portuguese','translate'],'english'],
 [['share','link','without a login','send a result','export'],'share'],
 [['three kinds','interactive','analyst','action','kind of worker'],'kinds'],
 [['surface','channel','whatsapp','sms','live chat'],'surfaces'],
 [['new job','get started','go live','first worker','set up a new'],'live'],
 [['what next','try next','not switched on','underuse'],'next']
];
var msgs=[], started=false;
var panel=document.getElementById('panel'), log=document.getElementById('log');
function openPanel(){ panel.classList.add('open'); }
function push(who,html){ msgs.push([who,html]); paint(); }
function paint(){ log.innerHTML=msgs.map(function(m){return '<div class="msg '+m[0]+'">'+m[1]+'</div>';}).join(''); log.scrollTop=log.scrollHeight; }
function think(cb){ log.insertAdjacentHTML('beforeend','<div class="typing" id="tp"><i></i><i></i><i></i></div>'); log.scrollTop=log.scrollHeight; setTimeout(function(){var t=document.getElementById('tp'); if(t)t.remove(); cb();},750); }
function reply(q){
  var s=q.toLowerCase(), hit=null;
  MATCH.forEach(function(m){ if(!hit && m[0].some(function(w){return s.indexOf(w)>-1;})) hit=m[1]; });
  if(hit){
    var d=document.createElement('div'); d.innerHTML=V[hit];
    return '<b>'+d.querySelector('.lede').textContent+'</b><div class="go" data-art="'+hit+'">Read: '+d.querySelector('h1').textContent+' \u2192</div>';
  }
  return 'In the live account I would check your workers, documents and connected systems before answering, and make the change directly if you wanted. In this prototype only the twelve written articles have canned replies. Try asking about handovers, credit usage, duplicate jobs, the three kinds of worker, or sharing a result.';
}
function ask(q){ q=(q||'').trim(); if(!q) return; openPanel(); started=true; push('me', q.replace(/</g,'&lt;')); think(function(){ push('ai', reply(q)); }); }

document.getElementById('bubble').addEventListener('click', function(){ if(!started){ push('ai','Ask me about anything in AIOS. I can answer, change a setting, or raise a ticket with the team.'); started=true; } openPanel(); });
document.getElementById('close').addEventListener('click', function(){ panel.classList.remove('open'); });
document.getElementById('ps').addEventListener('click', function(){ var i=document.getElementById('pi'); ask(i.value); i.value=''; });
document.getElementById('pi').addEventListener('keydown', function(e){ if(e.key==='Enter'){ ask(this.value); this.value=''; } });
document.addEventListener('keydown', function(e){ if(e.key!=='Enter') return; var i=e.target.closest('.ask input'); if(!i) return; e.preventDefault(); ask(i.value); i.value=''; });
document.addEventListener('click', function(e){
  var g=e.target.closest('[data-go]'), a=e.target.closest('[data-art]');
  if(a){ e.preventDefault(); show(a.getAttribute('data-art')); return; }
  if(g){ e.preventDefault(); show(g.getAttribute('data-go')); return; }
  var b=e.target.closest('.ask .btn');
  if(b){ var i=b.parentNode.querySelector('input'); ask(i.value); i.value=''; return; }
  var c=e.target.closest('.chip'); if(c){ ask(c.textContent); return; }
  var t=e.target.closest('.btn-primary, .topbar .btn');
  if(t && /Assistant|ticket/i.test(t.textContent)){ document.getElementById('bubble').click(); }
});
show('doc');

</script>
