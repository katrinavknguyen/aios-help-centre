<!DOCTYPE html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AIOS Help Centre - prototype</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --iai-purple:#6B30FF;
  --iai-navy:#2A2092;
  --iai-lavender:#D0BFFA;
  --iai-off-black:#1E1E1E;
  --iai-cream:#F8F2ED;
  --iai-blue-1:#371EE4;
  --iai-purple-3:#D6D2FF;
  --iai-purple-4:#EDE9F6;
  --iai-dark-grey:#474747;
  --iai-mid-grey:#717171;
  --iai-border:#E8E6F2;
  --iai-teal:#19D3C5;
  --radius-lg:30px;
  --radius-md:20px;
  --radius-sm:12px;
  --radius-pill:9999px;
  --shadow-sm:0 1px 2px rgba(42,32,146,.04);
  --shadow-md:0 4px 20px rgba(42,32,146,.06);
  --shadow-purple:0 2px 8px rgba(107,48,255,.25);
  --shadow-purple-lift:0 6px 16px rgba(107,48,255,.30);
  --font:'Gotham','Montserrat','Futura',-apple-system,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font);background:#fff;color:var(--iai-off-black);-webkit-font-smoothing:antialiased}
a{text-decoration:none;color:inherit}

/* top chrome */
.topbar{display:flex;align-items:center;justify-content:space-between;padding:14px 32px;border-bottom:1px solid var(--iai-border);position:sticky;top:0;background:#fff;z-index:20}
.topbar-left{display:flex;align-items:center;gap:14px;color:var(--iai-mid-grey);font-size:14px;font-weight:500}
.topbar-left .divider{width:1px;height:18px;background:var(--iai-border)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:12px 20px;border-radius:var(--radius-pill);font-weight:600;font-size:14px;font-family:var(--font);border:none;cursor:pointer;transition:transform 150ms ease,background 150ms ease,box-shadow 150ms ease,border-color 150ms ease,color 150ms ease}
.btn-sm{padding:8px 16px;font-size:13.5px}
.btn-primary{background:var(--iai-purple);color:#fff;box-shadow:var(--shadow-purple)}
.btn-primary:hover{background:var(--iai-blue-1);transform:translateY(-1px);box-shadow:var(--shadow-purple-lift)}
.btn-secondary{background:#fff;color:var(--iai-navy);border:1px solid var(--iai-border)}
.btn-secondary:hover{border-color:var(--iai-purple);color:var(--iai-purple)}
.btn-on-dark{background:#fff;color:var(--iai-navy)}
.btn-on-dark:hover{transform:translateY(-1px)}

.main{max-width:1240px;margin:0 auto;padding:32px 40px 90px}

/* page header */
.page-head{display:flex;align-items:flex-start;gap:16px;margin-bottom:22px}
.page-icon{width:48px;height:48px;border-radius:var(--radius-sm);background:var(--iai-purple-4);color:var(--iai-purple);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.page-head h1{font-size:32px;font-weight:800;letter-spacing:-.02em}
.page-head p{color:var(--iai-mid-grey);font-size:15px;margin-top:3px}

.tabs{display:inline-flex;background:#fff;border:1px solid var(--iai-border);padding:5px;border-radius:var(--radius-pill);gap:2px;margin-bottom:28px}
.tab{display:inline-flex;align-items:center;gap:7px;padding:9px 16px;border-radius:var(--radius-pill);font-weight:600;font-size:13px;color:var(--iai-dark-grey)}
.tab.active{background:var(--iai-purple);color:#fff;box-shadow:var(--shadow-purple)}
.tab svg{width:16px;height:16px}

/* Command hero */
.hero{background:linear-gradient(135deg,#6B30FF,#2A2092);border-radius:var(--radius-lg);padding:38px 40px 34px;color:#fff;margin-bottom:16px}
.hero-eyebrow{display:inline-flex;align-items:center;gap:7px;font-size:11.5px;font-weight:600;letter-spacing:.1em;text-transform:uppercase;color:var(--iai-purple-3);margin-bottom:14px}
.hero-eyebrow svg{width:14px;height:14px}
.hero h2{font-size:29px;font-weight:800;letter-spacing:-.02em;line-height:1.2;max-width:640px}
.hero p{color:var(--iai-purple-3);font-size:15px;margin-top:10px;max-width:600px;line-height:1.55}
.ask{display:flex;align-items:center;gap:12px;background:rgba(255,255,255,.13);border:1px solid rgba(255,255,255,.22);backdrop-filter:blur(4px);border-radius:var(--radius-pill);padding:8px 8px 8px 22px;margin-top:24px;max-width:720px}
.ask input{flex:1;background:none;border:none;outline:none;color:#fff;font-family:var(--font);font-size:15px;padding:10px 0}
.ask input::placeholder{color:rgba(255,255,255,.6)}
.chips{display:flex;flex-wrap:wrap;gap:9px;margin-top:16px}
.chip{border:1px solid rgba(255,255,255,.25);border-radius:var(--radius-pill);padding:7px 15px;font-size:13px;color:#fff;background:rgba(255,255,255,.06);cursor:pointer;transition:background 150ms ease}
.chip:hover{background:rgba(255,255,255,.16)}

/* fallback search */
.searchrow{display:flex;align-items:center;gap:13px;border:1px solid var(--iai-border);border-radius:var(--radius-pill);padding:13px 22px;margin-bottom:44px;color:var(--iai-mid-grey);background:#fff}
.searchrow svg{width:19px;height:19px;flex-shrink:0}
.searchrow input{flex:1;border:none;outline:none;font-family:var(--font);font-size:14.5px;color:var(--iai-off-black)}
.searchrow input::placeholder{color:var(--iai-mid-grey)}
.searchrow .kbd{font-size:11.5px;border:1px solid var(--iai-border);border-radius:6px;padding:3px 7px;color:var(--iai-mid-grey);font-weight:600}

/* section labels */
.sec-label{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px}
.sec-label h3{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--iai-mid-grey)}
.sec-label .note{font-size:13px;color:var(--iai-mid-grey)}

/* start here */
.starthere{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:48px}
.start-card{background:var(--iai-purple-4);border-radius:var(--radius-md);padding:22px;display:flex;flex-direction:column;gap:9px;transition:transform 180ms ease}
.start-card:hover{transform:translateY(-2px)}
.start-card .n{font-size:11.5px;font-weight:700;color:var(--iai-purple);letter-spacing:.06em}
.start-card h4{font-size:16px;font-weight:700;color:var(--iai-navy);line-height:1.3}
.start-card p{font-size:13px;color:var(--iai-dark-grey);line-height:1.5;flex:1}
.start-card .meta{font-size:12px;font-weight:600;color:var(--iai-mid-grey)}

/* category grid */
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:48px}
.card{background:#fff;border:1px solid var(--iai-border);border-radius:var(--radius-lg);padding:26px 26px 22px;display:flex;flex-direction:column;transition:border-color 180ms ease,box-shadow 180ms ease}
.card:hover{border-color:var(--iai-purple-3);box-shadow:var(--shadow-md)}
.card-top{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.card-ico{width:38px;height:38px;border-radius:var(--radius-sm);background:var(--iai-purple-4);color:var(--iai-purple);display:flex;align-items:center;justify-content:center;flex-shrink:0}
.card-ico svg{width:19px;height:19px}
.card h4{font-size:17px;font-weight:700;color:var(--iai-off-black);line-height:1.25}
.card ul{list-style:none;display:flex;flex-direction:column;gap:1px;flex:1}
.card li a{display:block;font-size:14px;color:var(--iai-dark-grey);padding:7px 0;border-bottom:1px solid #F4F3F9;line-height:1.4}
.card li:last-child a{border-bottom:none}
.card li a:hover{color:var(--iai-purple)}
.viewall{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:600;color:var(--iai-purple);margin-top:16px}
.viewall svg{width:14px;height:14px}

/* troubleshooting */
.trouble{background:var(--iai-cream);border-radius:var(--radius-lg);padding:32px 34px;margin-bottom:44px}
.trouble h3{font-size:22px;font-weight:700;color:var(--iai-navy);letter-spacing:-.01em}
.trouble>p{font-size:14px;color:var(--iai-dark-grey);margin-top:6px;margin-bottom:22px;max-width:560px;line-height:1.55}
.qgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.q{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--iai-border);border-radius:var(--radius-md);padding:15px 18px;font-size:14px;font-weight:500;color:var(--iai-off-black);transition:border-color 150ms ease}
.q:hover{border-color:var(--iai-purple)}
.q svg{width:17px;height:17px;color:var(--iai-purple);flex-shrink:0}
.q .arrow{margin-left:auto;color:var(--iai-mid-grey);width:15px;height:15px}

/* footer strip */
.footstrip{border:1px solid var(--iai-border);border-radius:var(--radius-lg);padding:28px 32px;display:flex;align-items:center;justify-content:space-between;gap:24px;flex-wrap:wrap}
.footstrip h4{font-size:18px;font-weight:700;color:var(--iai-off-black)}
.footstrip p{font-size:14px;color:var(--iai-mid-grey);margin-top:4px;max-width:520px;line-height:1.5}
.footstrip .actions{display:flex;gap:10px}

/* annotations */
.annot-wrap{max-width:1240px;margin:0 auto;padding:0 40px 70px}
.annot-wrap h3{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.12em;color:var(--iai-purple);margin-bottom:14px}
.annot{display:flex;gap:12px;align-items:flex-start;padding:13px 16px;background:var(--iai-purple-4);border-radius:10px;font-size:13.5px;color:var(--iai-dark-grey);line-height:1.55;margin-bottom:8px}
.annot-num{background:var(--iai-purple);color:#fff;width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:500;flex-shrink:0;margin-top:1px}
.annot b{color:var(--iai-navy);font-weight:700}




/* article view */
.crumb{display:inline-flex;align-items:center;gap:7px;font-size:13px;font-weight:600;color:var(--iai-purple);margin-bottom:22px;cursor:pointer}
.crumb svg{width:15px;height:15px}
.article{max-width:720px}
.article h1{font-size:32px;font-weight:800;letter-spacing:-.02em;line-height:1.2;margin-bottom:20px}
.lede{background:var(--iai-purple-4);border-radius:var(--radius-md);padding:20px 24px;font-size:17px;font-weight:700;color:var(--iai-navy);line-height:1.45;margin-bottom:28px}
.article h2{font-size:20px;font-weight:700;color:var(--iai-off-black);margin:32px 0 12px}
.article p{font-size:15.5px;line-height:1.65;color:var(--iai-dark-grey);margin-bottom:14px}
.article strong{color:var(--iai-off-black);font-weight:700}
.article ol{margin:0 0 16px 20px}
.article ol li{font-size:15.5px;line-height:1.65;color:var(--iai-dark-grey);margin-bottom:9px;padding-left:4px}
.callout{border:1px solid var(--iai-border);border-left:3px solid var(--iai-purple);border-radius:0 var(--radius-sm) var(--radius-sm) 0;padding:16px 20px;margin:24px 0;font-size:14.5px;line-height:1.6;color:var(--iai-dark-grey);background:#FCFCFE}
.callout b{color:var(--iai-navy)}
.related{margin-top:40px;padding-top:24px;border-top:1px solid var(--iai-border)}
.related h3{font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--iai-mid-grey);margin-bottom:12px}
.related a{display:block;font-size:14.5px;color:var(--iai-purple);padding:7px 0}
.artfoot{margin-top:36px;border:1px solid var(--iai-border);border-radius:var(--radius-lg);padding:24px 28px;display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}
.artfoot p{font-size:14.5px;font-weight:600;color:var(--iai-off-black)}
.artfoot span{font-size:13.5px;color:var(--iai-mid-grey);display:block;margin-top:3px;font-weight:400}
.dotl{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--iai-teal);margin-right:8px;vertical-align:middle}
.card li a.on{color:var(--iai-off-black);font-weight:600}
.card li a.on:hover{color:var(--iai-purple)}
.start-card.live{position:relative}
.start-card.live::after{content:"";position:absolute;top:15px;right:15px;width:6px;height:6px;border-radius:50%;background:var(--iai-teal)}
.legend{display:inline-flex;align-items:center;gap:7px;font-size:12.5px;color:var(--iai-mid-grey);text-transform:none;letter-spacing:0;font-weight:400}
#bubble{position:fixed;right:24px;bottom:24px;width:56px;height:56px;border-radius:50%;background:var(--iai-purple);color:#fff;border:none;cursor:pointer;box-shadow:0 6px 20px rgba(107,48,255,.4);display:flex;align-items:center;justify-content:center;z-index:60;transition:transform .18s}
#bubble:hover{transform:scale(1.06)}
#panel{position:fixed;top:0;right:0;width:400px;max-width:92vw;height:100vh;background:#fff;border-left:1px solid var(--iai-border);box-shadow:-8px 0 30px rgba(42,32,146,.10);z-index:70;display:flex;flex-direction:column;transform:translateX(105%);transition:transform .28s cubic-bezier(.4,0,.2,1)}
#panel.open{transform:translateX(0)}
#panel .ph2{display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid var(--iai-border)}
#panel .ph2 h4{font-size:15px;font-weight:700;display:flex;align-items:center;gap:9px}
#panel .ph2 .ic{width:28px;height:28px;border-radius:8px;background:var(--iai-purple);color:#fff;display:flex;align-items:center;justify-content:center}
#panel .x{background:none;border:none;cursor:pointer;color:var(--iai-mid-grey);padding:4px}
#log{flex:1;overflow-y:auto;padding:20px;display:flex;flex-direction:column;gap:14px}
.msg{max-width:88%;font-size:14px;line-height:1.55;border-radius:16px;padding:12px 15px}
.me{align-self:flex-end;background:var(--iai-purple);color:#fff;border-bottom-right-radius:5px}
.ai{align-self:flex-start;background:#F4F3F9;color:var(--iai-off-black);border-bottom-left-radius:5px}
.ai b{color:var(--iai-navy)}
.ai .go{display:inline-flex;align-items:center;gap:5px;margin-top:9px;font-size:13px;font-weight:600;color:var(--iai-purple);cursor:pointer}
.typing{align-self:flex-start;background:#F4F3F9;border-radius:16px;padding:14px 16px;display:flex;gap:4px}
.typing i{width:6px;height:6px;border-radius:50%;background:#B0AEC4;animation:bl 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes bl{0%,60%,100%{opacity:.3}30%{opacity:1}}
#pin{border-top:1px solid var(--iai-border);padding:14px 16px;display:flex;gap:9px;align-items:center}
#pin input{flex:1;border:1px solid var(--iai-border);border-radius:9999px;padding:11px 16px;font-family:var(--font);font-size:14px;outline:none}
#pin input:focus{border-color:var(--iai-purple)}
#pin button{width:38px;height:38px;border-radius:50%;background:var(--iai-purple);color:#fff;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stub{font-size:11.5px;color:var(--iai-mid-grey);text-align:center;padding:8px 20px;background:var(--iai-cream);border-bottom:1px solid var(--iai-border)}
@media (max-width:1100px){.grid{grid-template-columns:repeat(2,1fr)}.starthere{grid-template-columns:repeat(2,1fr)}.qgrid{grid-template-columns:1fr}}
</style>
</head>
<body>

</head>

<div class="topbar">
  <div class="topbar-left">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 3v18"/></svg>
    <span class="divider"></span>
    <span>Help</span>
  </div>
  <button class="btn btn-secondary btn-sm">
    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
    Ask the Assistant
  </button>
</div>

<div class="main" id="view"></div>
<button id="bubble" title="Assistant">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
</button>
<div id="panel">
  <div class="ph2">
    <h4><span class="ic"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg></span>Assistant</h4>
    <button class="x" id="close"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg></button>
  </div>
  <div class="stub">Prototype. Replies are canned, matched on keywords.</div>
  <div id="log"></div>
  <div id="pin">
    <input id="pi" placeholder="Ask me anything">
    <button id="ps"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4z"/></svg></button>
  </div>
</div>
<script>
var V = {"doc": "\n  <div class=\"page-head\">\n    <div class=\"page-icon\">\n      <svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3\"/><path d=\"M12 17h.01\"/></svg>\n    </div>\n    <div>\n      <h1>Help</h1>\n      <p>Everything your AI workforce can do, and how to put it to work.</p>\n    </div>\n  </div>\n\n  <div class=\"tabs\">\n    <a class=\"tab active\" href=\"#\" data-go=\"doc\">\n      <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z\"/><path d=\"M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>\n      Documentation\n    </a>\n    <a class=\"tab\" href=\"#\" data-go=\"support\">\n      <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"4\"/><path d=\"m4.93 4.93 4.24 4.24\"/><path d=\"m14.83 9.17 4.24-4.24\"/><path d=\"m14.83 14.83 4.24 4.24\"/><path d=\"m9.17 14.83-4.24 4.24\"/></svg>\n      Support\n    </a>\n  </div>\n\n  <div class=\"hero\">\n    <div class=\"hero-eyebrow\">\n      <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"/></svg>\n      AIOS Assistant\n    </div>\n    <h2>Ask the Assistant. It knows your account better than these articles do.</h2>\n    <p>It can see your workers, your documents and your connected systems. It will answer the question, make the change, or raise a ticket with our team when something needs us.</p>\n    <div class=\"ask\">\n      <input type=\"text\" placeholder=\"Why is my support worker handing every call to a person?\">\n      <button class=\"btn btn-on-dark btn-sm\">\n        Ask\n        <svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14\"/><path d=\"m12 5 7 7-7 7\"/></svg>\n      </button>\n    </div>\n    <div class=\"chips\">\n      <span class=\"chip\">Set up a new worker</span>\n      <span class=\"chip\">Why has my credit usage gone up?</span>\n      <span class=\"chip\">Something is broken</span>\n      <span class=\"chip\">Where do I change a greeting?</span>\n      <span class=\"chip\">What changed on this account this week?</span>\n    </div>\n  </div>\n\n  <div class=\"searchrow\">\n    <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"11\" cy=\"11\" r=\"8\"/><path d=\"m21 21-4.35-4.35\"/></svg>\n    <input type=\"text\" placeholder=\"Or search the documentation\">\n    <span class=\"kbd\">/</span>\n  </div>\n\n  <div class=\"sec-label\">\n    <h3>Start here</h3>\n    <span class=\"note\">All four written and live</span>\n  </div>\n  <div class=\"starthere\">\n    <a class=\"start-card live\" href=\"#\" data-art=\"kinds\">\n      <span class=\"n\">01</span>\n      <h4>Three kinds of worker</h4>\n      <p>Every worker you deploy is Interactive, Analyst or Action. Read this and the rest follows.</p>\n      <span class=\"meta\">4 min read</span>\n    </a>\n    <a class=\"start-card live\" href=\"#\" data-art=\"surfaces\">\n      <span class=\"n\">02</span>\n      <h4>The surfaces it works on</h4>\n      <p>Phone, chat, SMS, email, and the 900+ systems your workers can reach.</p>\n      <span class=\"meta\">5 min read</span>\n    </a>\n    <a class=\"start-card live\" href=\"#\" data-art=\"live\">\n      <span class=\"n\">03</span>\n      <h4>Putting a new job live</h4>\n      <p>Five steps, star g rather than rebuilding</a></li>\n      </ul>\n      <a class=\"viewall\" href=\"#\">View all 4 articles <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14\"/><path d=\"m12 5 7 7-7 7\"/></svg></a>\n    </div>\n\n  </div>\n\n  <div class=\"footstrip\">\n    <div>\n      <h4>Still stuck</h4>\n      <p>Some things still need a person, including phone numbers, new integrations, and anything requiring access from your IT team. Tell the Assistant and it will raise the ticket.</p>\n    </div>\n    <div class=\"actions\">\n      <button class=\"btn btn-secondary btn-sm\">View your tickets</button>\n      <button class=\"btn btn-primary btn-sm\">Raise a ticket</button>\n    </div>\n  </div>\n", "support": "\n  <div class=\"page-head\">\n    <div class=\"page-icon\">\n      <svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z\"/></svg>\n    </div>\n    <div>\n      <h1>Support</h1>\n      <p>Tickets you have raised, and their status.</p>\n    </div>\n  </div>\n\n  <div class=\"tabs\">\n    <a class=\"tab\" href=\"#\" data-go=\"doc\">\n      <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z\"/><path d=\"M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z\"/></svg>\n      Documentation\n    </a>\n    <a class=\"tab active\" href=\"#\" data-go=\"support\">\n      <svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><circle cx=\"12\" cy=\"12\" r=\"4\"/><path d=\"m4.93 4.93 4.24 4.24\"/><path d=\"m14.83 9.17 4.24-4.24\"/><path d=\"m14.83 14.83 4.24 4.24\"/><path d=\"m9.17 14.83-4.24 4.24\"/></svg>\n      Support\n    </a>\n  </div>\n\n  <div class=\"footstrip\" style=\"margin-bottom:16px\">\n    <div>\n      <h4>Raise a ticket</h4>\n      <p>Describe the issue to the Assistant. It takes the detail, raises the ticket, and it appears below with its status and our replies.</p>\n    </div>\n    <div class=\"actions\">\n      <button class=\"btn btn-primary btn-sm\">Raise a ticket</button>\n    </div>\n  </div>\n\n  <div style=\"display:flex;align-items:center;gap:10px;border:1px solid var(--iai-border);border-radius:var(--radius-md);padding:14px 20px;margin-bottom:44px;font-size:14px;color:var(--iai-dark-grey)\">\n    <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"var(--iai-purple)\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"/><path d=\"M12 6v6l4 2\"/></svg>\n    We reply Monday to Friday, 9am to 6pm UK time.\n  </div>\n\n  <div class=\"sec-label\">\n    <h3>Your tickets</h3>\n    <span class=\"note\">Raised by you or by the Assistant on your behalf</span>\n  </div>\n  <div style=\"border:1px dashed var(--iai-border);border-radius:var(--radius-lg);padding:44px 32px;text-align:center;background:#fff\">\n    <div style=\"width:56px;height:56px;border-radius:var(--radius-pill);background:var(--iai-purple-4);color:var(--iai-purple);display:inline-flex;align-items:center;justify-content:center;margin-bottom:14px\">\n      <svg width=\"24\" height=\"24\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"1.9\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z\"/><path d=\"M14 2v5h5\"/></svg>\n    </div>\n    <h3 style=\"font-size:18px;font-weight:700;margin-bottom:6px\">You have no open tickets</h3>\n    <p style=\"color:var(--iai-mid-grey);font-size:14px;max-width:400px;margin:0 auto;line-height:1.55\">Anything you raise with the Assistant appears here, with its status and our replies.</p>\n  </div>\n\n  <div class=\"footstrip\" style=\"margin-top:44px\">\n    <div>\n      <h4>Looking for how something works</h4>\n      <p>The Assistant can answer product questions and make changes to your account directly. Faster than waiting on a ticket.</p>\n    </div>\n    <div class=\"actions\">\n      <button class=\"btn btn-secondary btn-sm\">Browse documentation</button>\n      <button class=\"btn btn-primary btn-sm\">Ask the Assistant</button>\n    </div>\n  </div>\n", "handover": "<a class=\"crumb\" href=\"#\" data-go=\"doc\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m15 18-6-6 6-6\"/></svg>All help articles</a><div class=\"article\"><h1>Why does my worker keep handing over to a person?</h1><div class=\"lede\">Almost always because the knowledge behind it is thin, not because the worker is underperforming.</div><p>A worker disengages rather than improvising. That is deliberate. When it meets a question it cannot answer from its documents, it hands over instead of guessing.</p>\n<p>So a pattern of handovers is a list of the answers you have not given it yet.</p>\n<h2>What to do</h2>\n<ol><li>Open the worker's conversations and read the handovers, not the successes.</li>\n<li>Look for the question that keeps appearing. It is usually two or three, not twenty.</li>\n<li>Write those answers into a document and attach it in Documents.</li>\n<li>Test the same question again before assuming it is fixed.</li></ol>\n<p>A worker that hands over on fees, availability and booking is telling you exactly which three documents are missing.</p>\n<div class=\"callout\"><b>Worth knowing.</b> Frequent handovers are not a fault, they are the worker doing the right thing with what it has. The fix is upstream.</div><div class=\"related\"><h3>Related</h3><a href=\"#\">What to upload, and why it matters most</a><a href=\"#\">The difference knowledge makes</a></div><div class=\"artfoot\"><p>Did this answer your question?<span>If not, the Assistant can look at your account directly.</span></p><div class=\"actions\"><button class=\"btn btn-secondary btn-sm\">No</button><button class=\"btn btn-primary btn-sm\">Ask the Assistant</button></div></div></div>", "wrong-answer": "<a class=\"crumb\" href=\"#\" data-go=\"doc\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m15 18-6-6 6-6\"/></svg>All help articles</a><div class=\"article\"><h1>My worker gave a confidently wrong answer</h1><div class=\"lede\">Check the document behind it before anything else. A worker cannot tell that a price it was given has since changed.</div><p>A worker answers from the documents you attached. If the price, the opening time or the policy changed and the document did not, it will state the old answer with complete confidence and will not know it is wrong.</p>\n<p>This is the single most common cause of a bad answer, and it is not a model problem.</p>\n<h2>What to do</h2>\n<ol><li>Find the exact claim in the answer, then find the document it came from.</li>\n<li>Update the document rather than editing the worker's prompt.</li>\n<li>If several workers use that knowledge set, updating it once fixes all of them.</li>\n<li>Ask the worker the same question again to confirm.</li></ol>\n<h2>If the document was already correct</h2>\n<p>The answer may have been reasoned rather than retrieved. Add the fact explicitly to the knowledge instead of relying on the worker to work it out. Answering from a document is both cheaper and more accurate than reasoning from scratch.</p><div class=\"related\"><h3>Related</h3><a href=\"#\">What to upload, and why it matters most</a><a href=\"#\">Keeping documents current</a></div><div class=\"artfoot\"><p>Did this answer your question?<span>If not, the Assistant can look at your account directly.</span></p><div class=\"actions\"><button class=\"btn btn-secondary btn-sm\">No</button><button class=\"btn btn-primary btn-sm\">Ask the Assistant</button></div></div></div>", "credits": "<a class=\"crumb\" href=\"#\" data-go=\"doc\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m15 18-6-6 6-6\"/></svg>All help articles</a><div class=\"article\"><h1>My credit usage is higher than last month</h1><div class=\"lede\">Start with Scheduled Jobs and Billing and Usage. In that order.</div><p>Usage rises for four common reasons, and three of them are fixable in ten minutes.</p>\n<p><strong>A duplicate scheduled job.</strong> Two jobs doing the same thing double the cost of that job for as long as both run. They are easy to create by accident and quiet once running. Read down Scheduled Jobs and delete one of any pair.</p>\n<p><strong>You are still building.</strong> Configuring and testing a worker consumes credits the same way real work does. The weeks you set something up will always look heavier than the steady state that follows.</p>\n<p><strong>A job is running more often than anyone reads it.</strong> An hourly report nobody opens before Friday should run on Friday.</p>\n<p><strong>Voice volume went up.</strong> Voice scales with time, so a month with longer calls costs more even at the same call count.</p>\n<h2>What to do</h2>\n<ol><li>Open Scheduled Jobs and look for duplicates and anything nobody reads.</li>\n<li>Open Billing and Usage and sort by the largest consumers.</li>\n<li>Compare the top few against what they produced. If nobody uses the output, turn it off.</li></ol>\n<div class=\"callout\"><b>If it still does not add up.</b> Tell us the use case and the volume you expected. Optimisation is difficult to do blind and straightforward once we can see what a worker is for.</div><div class=\"related\"><h3>Related</h3><a href=\"#\">What things cost, in bands</a><a href=\"#\">Getting more out of the same spend</a></div><div class=\"artfoot\"><p>Did this answer your question?<span>If not, the Assistant can look at your account directly.</span></p><div class=\"actions\"><button class=\"btn btn-secondary btn-sm\">No</button><button class=\"btn btn-primary btn-sm\">Ask the Assistant</button></div></div></div>", "duplicate": "<a class=\"crumb\" href=\"#\" data-go=\"doc\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m15 18-6-6 6-6\"/></svg>All help articles</a><div class=\"article\"><h1>The same job is running twice</h1><div class=\"lede\">Open Scheduled Jobs. You almost certainly have two entries doing the same thing.</div><p>Duplicates happen when a job is set up twice, or when a worker was copied along with its schedule. Nothing warns you, and both carry on running.</p>\n<h2>What to do</h2>\n<ol><li>Open Scheduled Jobs and read the full list, not just the recent runs.</li>\n<li>Look for two entries with the same output or the same trigger time.</li>\n<li>Delete one. Keep the one with the configuration you recognise.</li>\n<li>Check Billing and Usage afterwards to confirm the spend has halved.</li></ol>\n<div class=\"callout\"><b>Stop it happening again.</b> Read Scheduled Jobs once a week. It takes a minute and it is the cheapest habit in the account.</div><div class=\"related\"><h3>Related</h3><a href=\"#\">The five triggers</a><a href=\"#\">What things cost, in bands</a></div><div class=\"artfoot\"><p>Did this answer your question?<span>If not, the Assistant can look at your account directly.</span></p><div class=\"actions\"><button class=\"btn btn-secondary btn-sm\">No</button><button class=\"btn btn-primary btn-sm\">Ask the Assistant</button></div></div></div>", "contacts": "<a class=\"crumb\" href=\"#\" data-go=\"doc\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m15 18-6-6 6-6\"/></svg>All help articles</a><div class=\"article\"><h1>I cannot add a contact from inside a team</h1><div class=\"lede\">Contacts are created in CRM, not inside a team. This is by design rather than a missing button.</div><p>A worker can only be assigned to a contact that already exists. So the order is always CRM first, then the team.</p>\n<h2>What to do</h2>\n<ol><li>Open CRM.</li>\n<li>Add the contact, or import a list.</li>\n<li>Go back to the team and assign the worker to them.</li></ol>\n<div class=\"callout\"><b>If you are testing.</b> Add yourself as a contact and assign the worker to reach you. It is the fastest way to experience exactly what your customer experiences, and it costs almost nothing.</div><div class=\"related\"><h3>Related</h3><a href=\"#\">Adding contacts before assigning a worker</a><a href=\"#\">Testing with your own number</a></div><div class=\"artfoot\"><p>Did this answer your question?<span>If not, the Assistant can look at your account directly.</span></p><div class=\"actions\"><button class=\"btn btn-secondary btn-sm\">No</button><button class=\"btn btn-primary btn-sm\">Ask the Assistant</button></div></div></div>", "stuck": "<a class=\"crumb\" href=\"#\" data-go=\"doc\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m15 18-6-6 6-6\"/></svg>All help articles</a><div class=\"article\"><h1>My computer use worker got stuck mid-run</h1><div class=\"lede\">Watch the video of the run. The step trace shows what it was doing at the moment it went wrong.</div><p>Every computer use run is recorded, with a step-by-step trace of what it did and why. That recording answers the question faster than reading the configuration.</p>\n<p>Most stalls come from one of three things.</p>\n<p><strong>The page was not described well enough.</strong> Describing where things sit, what scrolls and what pops up is the highest-value thing you can add to a computer use worker.</p>\n<p><strong>No stop condition was set.</strong> Without a maximum number of items and a limit on consecutive errors, a run that goes wrong keeps going rather than stopping.</p>\n<p><strong>The instructions assumed knowledge.</strong> Write them as numbered steps, the way you would tell a new starter who has never seen the screen.</p>\n<h2>What to do</h2>\n<ol><li>Open the run and watch the video to the point of failure.</li>\n<li>Read the step trace at that moment.</li>\n<li>Add the missing page detail, or the missing stop condition, then run it again on a small batch.</li></ol>\n<div class=\"callout\"><b>Worth knowing.</b> The worker detects when it is repeating itself and stops. A run that ended early may have caught its own loop rather than failed.</div><div class=\"related\"><h3>Related</h3><a href=\"#\">Computer Use Team: systems with no connection</a><a href=\"#\">Setting stop conditions</a></div><div class=\"artfoot\"><p>Did this answer your question?<span>If not, the Assistant can look at your account directly.</span></p><div class=\"actions\"><button class=\"btn btn-secondary btn-sm\">No</button><button class=\"btn btn-primary btn-sm\">Ask the Assistant</button></div></div></div>", "english": "<a class=\"crumb\" href=\"#\" data-go=\"doc\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m15 18-6-6 6-6\"/></svg>All help articles</a><div class=\"article\"><h1>My worker only answers in English</h1><div class=\"lede\">Workers operate in English unless you configure another language deliberately. Nothing is broken.</div><p>Other languages are available. They are set up per worker rather than switched on across the account.</p>\n<h2>What to do</h2>\n<p>Tell the Assistant which worker and which language, and it will configure it. Or set it on the worker directly.</p>\n<div class=\"callout\"><b>Worth knowing.</b> A worker holds one persona and one script. If you need two languages on the same line, that is two workers sharing the same knowledge, not one worker switching mid-conversation.</div><div class=\"related\"><h3>Related</h3><a href=\"#\">One worker, one persona, one channel</a><a href=\"#\">The limits</a></div><div class=\"artfoot\"><p>Did this answer your question?<span>If not, the Assistant can look at your account directly.</span></p><div class=\"actions\"><button class=\"btn btn-secondary btn-sm\">No</button><button class=\"btn btn-primary btn-sm\">Ask the Assistant</button></div></div></div>", "share": "<a class=\"crumb\" href=\"#\" data-go=\"doc\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m15 18-6-6 6-6\"/></svg>All help articles</a><div class=\"article\"><h1>Can I send a result to someone without a login?</h1><div class=\"lede\">Yes, two ways, and neither needs the recipient to be a user on your account.</div><p><strong>Share an analyst result as a link.</strong> Analyst output can be given a link that opens without a login. Useful for sending a single result to someone outside the business.</p>\n<p><strong>Have a scheduled job email its output.</strong> If the same person needs the same thing regularly, put the job on a schedule and have it send directly to them. Nobody has to remember.</p>\n<p>Exports work the same way. Any table can be exported, including analyses, task runs, computer use runs and activity logs, and exports arrive by email. You can export a filtered view rather than everything.</p>\n<div class=\"callout\"><b>Worth knowing.</b> Most accounts assume this is not possible and copy results out by hand. It is worth checking before you build a manual step around it.</div><div class=\"related\"><h3>Related</h3><a href=\"#\">What comes back out: reports and exports</a><a href=\"#\">Sharing output with people outside the account</a></div><div class=\"artfoot\"><p>Did this answer your question?<span>If not, the Assistant can look at your account directly.</span></p><div class=\"actions\"><button class=\"btn btn-secondary btn-sm\">No</button><button class=\"btn btn-primary btn-sm\">Ask the Assistant</button></div></div></div>", "kinds": "<a class=\"crumb\" href=\"#\" data-go=\"doc\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m15 18-6-6 6-6\"/></svg>All help articles</a><div class=\"article\"><h1>Three kinds of worker</h1><div class=\"lede\">Every worker you will ever deploy is one of three kinds. Read this and the rest of the documentation follows.</div><p>The six teams on screen are categories of work. Underneath them there are only three things a worker actually does.</p>\n<h2>Interactive</h2>\n<p>Holds a conversation. Calls, live chat, SMS and email, inbound or outbound. WhatsApp too, through an integration.</p>\n<p><strong>Give it</strong> anything where a person needs talking to and the conversation follows a known shape.</p>\n<h2>Analyst</h2>\n<p>Reads, reviews and surfaces. Calls, recordings, video, documents, spreadsheets, email.</p>\n<p><strong>Give it</strong> anything where the information already exists but nobody has time to go through it.</p>\n<h2>Action</h2>\n<p>Executes across systems. Data entry, forms, scheduling, updates, and operating software directly.</p>\n<p><strong>Give it</strong> anything repetitive that ends in something being changed, sent or recorded.</p>\n<h2>They chain together</h2>\n<p>Most jobs worth doing need two or three working in sequence. A call gets answered, the call gets reviewed, and the outcome gets written into your system. One worker per step.</p>\n<div class=\"callout\"><b>Build one worker per job.</b> A worker asked to do one job well is more reliable than one asked to do four. If a job has three parts, that is three workers passing work between them, not one worker with a longer brief.</div>\n<h2>How the three map to the six teams</h2>\n<p><strong>Sales Team</strong> and <strong>Support Team</strong> are Interactive, on phone, live chat, SMS and email.</p>\n<p><strong>Task Team</strong> and <strong>Computer Use Team</strong> are Action, the first across your connections and webhooks, the second on the browser and desktop.</p>\n<p><strong>Analyst Team</strong> is Analyst, working over calls, audio, video, spreadsheets and documents.</p>\n<p>The Assistant spans all three.</p><div class=\"related\"><h3>Related</h3><a href=\"#\">The surfaces it works on</a><a href=\"#\">The six teams, and what to give each one</a></div><div class=\"artfoot\"><p>Did this answer your question?<span>If not, the Assistant can look at your account directly.</span></p><div class=\"actions\"><button class=\"btn btn-secondary btn-sm\">No</button><button class=\"btn btn-primary btn-sm\">Ask the Assistant</button></div></div></div>", "surfaces": "<a class=\"crumb\" href=\"#\" data-go=\"doc\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m15 18-6-6 6-6\"/></svg>All help articles</a><div class=\"article\"><h1>The surfaces it works on</h1><div class=\"lede\">A worker is only useful where your customers and your systems already are. These are the surfaces available today.</div><h2>Conversation surfaces</h2>\n<p><strong>Inbound calls.</strong> Answers with your configured greeting, handles the conversation, books, resolves or transfers. Covers overflow when your lines are busy, and every hour you do not staff.</p>\n<p><strong>Outbound calls.</strong> Calls a list, qualifies, books, and leaves a voicemail when nobody answers. Runs at volume without a rota.</p>\n<p><strong>Call transfer.</strong> Two ways. Blind passes the call straight through. Warm waits for your colleague, briefs them, then connects the caller.</p>\n<p><strong>Live chat.</strong> Runs on your website or inside your own application. Every messaging worker generates an endpoint your developer can drop into any page.</p>\n<p><strong>SMS.</strong> Confirmations, reminders, follow-ups after an unanswered call, and full two-way exchanges.</p>\n<p><strong>Email.</strong> Reads what arrives, drafts replies, sends follow-ups, and chases what went unanswered.</p>\n<p><strong>WhatsApp.</strong> Two-way conversation on the channel many customers now prefer over calling. This one is not switched on inside the account like the others. It runs through an integration that has to be connected and approved first, so talk to us before you plan around it.</p>\n<div class=\"callout\"><b>A worker is built per channel.</b> The same job on the phone and on live chat is two workers sharing the same knowledge, not one worker with two mouths. Each gets a script written for how people actually behave on that channel.</div>\n<h2>System surfaces</h2>\n<p><strong>900+ connections.</strong> Direct connections to CRMs, calendars, helpdesks, inboxes, spreadsheets, accounting and messaging apps. If a system is on the list, a worker can read from it and write to it.</p>\n<p><strong>Your own systems.</strong> Anything with an API connects directly, and so does any MCP server. On screen these are Custom apps, so workers can reach software you built in-house as well as off-the-shelf tools.</p>\n<p><strong>Any screen at all.</strong> Where no connection exists, a worker drives a real browser session and uses the software the way a person would. Old portals, supplier systems, anything with a login.</p>\n<p><strong>Events and webhooks.</strong> Work does not have to be started by a person. An event in a connected system can set a worker off, and any system you own can start one directly.</p>\n<h2>Material it can read</h2>\n<p>Analyst workers are not limited to live conversation. They work over call recordings, audio, video, transcripts, email, spreadsheets, documents and PDFs you already hold.</p><div class=\"related\"><h3>Related</h3><a href=\"#\">Three kinds of worker</a><a href=\"#\">The 900+ direct connections</a></div><div class=\"artfoot\"><p>Did this answer your question?<span>If not, the Assistant can look at your account directly.</span></p><div class=\"actions\"><button class=\"btn btn-secondary btn-sm\">No</button><button class=\"btn btn-primary btn-sm\">Ask the Assistant</button></div></div></div>", "live": "<a class=\"crumb\" href=\"#\" data-go=\"doc\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m15 18-6-6 6-6\"/></svg>All help articles</a><div class=\"article\"><h1>Putting a new job live</h1><div class=\"lede\">Five steps. You can do all of them yourself, and the Assistant will walk you through any of them if you ask.</div><h2>1. Pick the job</h2>\n<p>Look for work that happens over and over, follows the same shape every time, and never gets the attention it deserves. That is the one.</p>\n<h2>2. Write it as one sentence</h2>\n<p>Take over the work, currently this much per period, and the number that should move is this. If you cannot complete that sentence, the gap is usually why the work has never been fixed.</p>\n<h2>3. Give it the knowledge</h2>\n<p>Upload what it needs to answer from into Documents. Your prices, policies, session times, and the answers you give every day. In your words, not polished.</p>\n<h2>4. Test it before it goes live</h2>\n<p>Use Talk to Agent and Test Messaging. Add yourself as a contact in CRM and let it contact you. Experience it the way your customer will.</p>\n<h2>5. Schedule it or trigger it</h2>\n<p>Once it works, take yourself out of the loop. Put it on a schedule, or have another worker start it.</p>\n<h2>Then keep it working</h2>\n<p><strong>Blueprint what works.</strong> Save a working configuration and create the next one from it. For a group of seventeen sites this is the difference between building once and building seventeen times.</p>\n<p><strong>Check the evidence, not the impression.</strong> CRM holds every contact and every action a worker has taken. Task Runs and Computer Use Runs hold every execution with its inputs and outputs.</p>\n<p><strong>Read Scheduled Jobs weekly.</strong> Duplicates are easy to create by accident, and a forgotten job carries on running.</p>\n<p><strong>Keep the documents current.</strong> When a price, a time or a number changes, update the document. This affects quality more than anything else you do.</p><div class=\"related\"><h3>Related</h3><a href=\"#\">What to upload, and why it matters most</a><a href=\"#\">The five triggers</a></div><div class=\"artfoot\"><p>Did this answer your question?<span>If not, the Assistant can look at your account directly.</span></p><div class=\"actions\"><button class=\"btn btn-secondary btn-sm\">No</button><button class=\"btn btn-primary btn-sm\">Ask the Assistant</button></div></div></div>", "next": "<a class=\"crumb\" href=\"#\" data-go=\"doc\"><svg viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m15 18-6-6 6-6\"/></svg>All help articles</a><div class=\"article\"><h1>What to try next</h1><div class=\"lede\">The capabilities most accounts have not switched on. Each one is available today and needs nothing built from scratch.</div><p>Each of these also consumes credits every time it runs. Worth adding them one at a time and watching Billing and Usage as you go, rather than switching on five at once.</p>\n<h2>Point an Analyst worker at material you already hold</h2>\n<p>Nothing has to be connected or built. Recordings, emails and documents already exist, so you get a picture of what you are missing within days. Usually the cheapest way to get value early.</p>\n<h2>Add a second channel to a worker you already trust</h2>\n<p>If the phone worker is good, the same knowledge on live chat, SMS or email is a short step. Your customers are not all on the phone.</p>\n<h2>Schedule the report you produce by hand</h2>\n<p>Small, safe, and it proves the schedule works. Most accounts have at least one of these.</p>\n<h2>Chain an analysis into an action</h2>\n<p>Connect a task to an Analyst worker and it runs after every analysis. Finding something and doing something about it become one movement. This is the step most accounts have not taken.</p>\n<h2>Put a Computer Use worker on the system nobody wants to touch</h2>\n<p>The portal with no connection, the supplier site, the legacy screen. This is the capability people forget exists.</p>\n<h2>Get a result to someone who does not use the account</h2>\n<p>Schedule a job to email its output, or share an analyst result as a link that opens without a login.</p>\n<h2>Have a worker flag what matters to you</h2>\n<p>Give it your own criteria, such as cross-sell openings, unhappy customers, enquiries over a value, or a competitor named, and have it escalate to a person rather than logging it.</p>\n<h2>Combine several analysts into one daily report</h2>\n<p>Rather than reading four sets of findings, have them synthesised into a single prioritised report that arrives each morning.</p>\n<h2>Reactivate customers who went quiet</h2>\n<p>Revenue from people who already know you. Best once one worker is live and trusted.</p><div class=\"related\"><h3>Related</h3><a href=\"#\">Three kinds of worker</a><a href=\"#\">Chaining one worker into another</a></div><div class=\"artfoot\"><p>Did this answer your question?<span>If not, the Assistant can look at your account directly.</span></p><div class=\"actions\"><button class=\"btn btn-secondary btn-sm\">No</button><button class=\"btn btn-primary btn-sm\">Ask the Assistant</button></div></div></div>"};
var el=document.getElementById('view');
function show(k){ el.innerHTML=V[k]||V.doc; window.scrollTo(0,0); }

var MATCH=[
 [['hand','handover','hands over','gives up','escalat'],'handover'],
 [['wrong','incorrect','made up','outdated','old price'],'wrong-answer'],
 [['credit','usage','cost','bill','spend','expensive'],'credits'],
 [['twice','duplicate','double'],'duplicate'],
 [['contact','lead','crm'],'contacts'],
 [['stuck','computer use','browser','frozen','loop'],'stuck'],
 [['english','language','spanish','portuguese','translate'],'english'],
 [['share','link','without a login','send a result','export'],'share'],
 [['three kinds','interactive','analyst','action','kind of worker'],'kinds'],
 [['surface','channel','whatsapp','sms','live chat'],'surfaces'],
 [['new job','get started','go live','first worker','set up a new'],'live'],
 [['what next','try next','not switched on','underuse'],'next']
];
var msgs=[], started=false;
var panel=document.getElementById('panel'), log=document.getElementById('log');
function openPanel(){ panel.classList.add('open'); }
function push(who,html){ msgs.push([who,html]); paint(); }
function paint(){ log.innerHTML=msgs.map(function(m){return '<div class="msg '+m[0]+'">'+m[1]+'</div>';}).join(''); log.scrollTop=log.scrollHeight; }
function think(cb){ log.insertAdjacentHTML('beforeend','<div class="typing" id="tp"><i></i><i></i><i></i></div>'); log.scrollTop=log.scrollHeight; setTimeout(function(){var t=document.getElementById('tp'); if(t)t.remove(); cb();},750); }
function reply(q){
  var s=q.toLowerCase(), hit=null;
  MATCH.forEach(function(m){ if(!hit && m[0].some(function(w){return s.indexOf(w)>-1;})) hit=m[1]; });
  if(hit){
    var d=document.createElement('div'); d.innerHTML=V[hit];
    return '<b>'+d.querySelector('.lede').textContent+'</b><div class="go" data-art="'+hit+'">Read: '+d.querySelector('h1').textContent+' \u2192</div>';
  }
  return 'In the live account I would check your workers, documents and connected systems before answering, and make the change directly if you wanted. In this prototype only the twelve written articles have canned replies. Try asking about handovers, credit usage, duplicate jobs, the three kinds of worker, or sharing a result.';
}
function ask(q){ q=(q||'').trim(); if(!q) return; openPanel(); started=true; push('me', q.replace(/</g,'&lt;')); think(function(){ push('ai', reply(q)); }); }

document.getElementById('bubble').addEventListener('click', function(){ if(!started){ push('ai','Ask me about anything in AIOS. I can answer, change a setting, or raise a ticket with the team.'); started=true; } openPanel(); });
document.getElementById('close').addEventListener('click', function(){ panel.classList.remove('open'); });
document.getElementById('ps').addEventListener('click', function(){ var i=document.getElementById('pi'); ask(i.value); i.value=''; });
document.getElementById('pi').addEventListener('keydown', function(e){ if(e.key==='Enter'){ ask(this.value); this.value=''; } });
document.addEventListener('keydown', function(e){ if(e.key!=='Enter') return; var i=e.target.closest('.ask input'); if(!i) return; e.preventDefault(); ask(i.value); i.value=''; });
document.addEventListener('click', function(e){
  var g=e.target.closest('[data-go]'), a=e.target.closest('[data-art]');
  if(a){ e.preventDefault(); show(a.getAttribute('data-art')); return; }
  if(g){ e.preventDefault(); show(g.getAttribute('data-go')); return; }
  var b=e.target.closest('.ask .btn');
  if(b){ var i=b.parentNode.querySelector('input'); ask(i.value); i.value=''; return; }
  var c=e.target.closest('.chip'); if(c){ ask(c.textContent); return; }
  var t=e.target.closest('.btn-primary, .topbar .btn');
  if(t && /Assistant|ticket/i.test(t.textContent)){ document.getElementById('bubble').click(); }
});
show('doc');
